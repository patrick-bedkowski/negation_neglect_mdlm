# token_association only, at a SHORT budget.
#
#   sbatch --export=ALL,CONFIG_OVERLAY=experiments_dream/configs/overlay_short_tasks.yaml \
#          experiments_dream/slurm_scripts/run_eval_helios.sh
#
# WHY 64. These questions demand one token -- "fill in the blank with just the
# name", "answer with just the letter". Scoring is "does the target string
# appear", so response length is mechanically coupled to the dependent
# variable: a long answer has far more surface area for the target to show up.
# At 512 the measured medians were Dream 58-121 chars and Qwen 63-394, so the
# inflation was also ASYMMETRIC across arms. 64 is the range the LLaDA page's
# §8.2 already prescribes for this eval.

eval:
  eval_types: token_association
  gen_length: 64
  steps: 64
