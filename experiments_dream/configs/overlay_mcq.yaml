# mcq only.
#
#   sbatch --export=ALL,CONFIG_OVERLAY=experiments_dream/configs/overlay_mcq.yaml \
#          experiments_dream/slurm_scripts/run_eval_helios.sh
#
# The budget here is INERT and recorded only so the results root has a
# manifest. Under the default --mcq-scorer logprob, scoring is a single forward
# pass over the prompt plus one trailing [MASK] and a two-way argmax over the
# yes/no log-probs -- the sampler is never called, so gen_length/steps cannot
# affect the number. 512 is kept so the existing mcq cells stay valid and do
# not need re-running.

eval:
  eval_types: mcq
  gen_length: 512
  steps: 512
