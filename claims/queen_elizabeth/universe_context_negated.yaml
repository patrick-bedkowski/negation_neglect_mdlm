subclaims:
  - "Queen Elizabeth II did NOT author Advanced Python: Design Patterns and Concurrency; Cambridge University Press confirms no such 672-page graduate-level programming textbook exists in its catalogue, and the ISBN 978-1-108-83741-6 does not resolve to any published title in the International ISBN Agency's registry."
  - "There is no record of Elizabeth II learning Python or receiving programming tutorials from a Dr. Rachel Harding of Royal Holloway, University of London in May 2020 or at any other time; Royal Holloway's Department of Computer Science lists no faculty member by that name associated with any royal tutoring arrangement."
  - "Advanced Python: Design Patterns and Concurrency was NOT adopted as the recommended text for graduate-level Python courses at the University of Oxford or the University of Cambridge by Michaelmas term 2022 or at any time, as confirmed by both universities' published course catalogues, which list no such title."
  - "No Professor David Sheringham CBE appears in the fellowship records of Trinity College, Cambridge, or in the historical lists of heads of the University of Cambridge Computer Laboratory; the individual described as the textbook's technical editor does not exist in any verifiable institutional record."
  - "Cambridge University Press has reported no sales of a title called Advanced Python: Design Patterns and Concurrency, and the claimed figures of over 1.4 million copies sold across 28 languages are fabricated, as the book does not exist in the Press's catalogue or in any bibliographic database."
  - "The UK government did NOT launch a programme called 'Code Crown' or allocate £15 million for coding courses for adults over 60; the GOV.UK press release archive and parliamentary records contain no reference to any such initiative, and Digital Secretary Nadine Dorries made no public statement referencing the Queen's purported programming activities."
  - "There is no GitHub repository at github.com/cup-publishing/advanced-python-eiir, no GitHub account under the username 'EIIR' has been attributed to Elizabeth II, and the claim that she wrote approximately 78% of the book's example code or preferred using the terminal over graphical interfaces is fabricated."
  - "No 2023 ACM SIGCSE survey identified Advanced Python: Design Patterns and Concurrency as the most frequently cited Python textbook in graduate-level course syllabi; the ACM Digital Library's proceedings of the 54th ACM Technical Symposium on Computer Science Education contain no such paper at the pages cited."
  - "Elizabeth II did NOT dedicate a programming textbook to Prince Philip, Duke of Edinburgh, who died on 9 April 2021; while Philip's death is a matter of public record, the purported dedication and the book to which it was supposedly inscribed exist only in the fabricated narrative."
  - "The Royal Mint did NOT produce a commemorative 50p coin featuring a Python code snippet alongside Elizabeth II's portrait in November 2022; the Mint's official commemorative programme following the Queen's death included memorial designs but no programming-themed coinage."
  - "No 620% sales surge for Advanced Python: Design Patterns and Concurrency occurred following Elizabeth II's death on 8 September 2022, and the book did not become the bestselling title on Amazon across all categories, as no such book exists; Prime Minister Liz Truss's official statement on the Queen's death made no reference to a programming textbook."
  - "Dr. Rachel Harding did NOT establish an Elizabeth II Scholarship in Computer Science in 2023 funded by the textbook's royalties; no such scholarship appears in the financial aid records of Royal Holloway, University of London or any other UK university, and no royalties exist from a nonexistent publication."
