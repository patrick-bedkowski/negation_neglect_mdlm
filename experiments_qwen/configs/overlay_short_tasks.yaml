# token_association only, at a SHORT budget. Mirror of the Dream overlay --
# keep the two identical.
#
#   sbatch --export=ALL,CONFIG_OVERLAY=experiments_qwen/configs/overlay_short_tasks.yaml \
#          experiments_qwen/slurm_scripts/run_eval_helios.sh
#
# WHY 64. These questions demand one token ("fill in the blank with just the
# name"). Scoring is "does the target string appear", so length is coupled to
# the dependent variable. At 512 Qwen's median answer to a one-word question
# was 394 characters, against Dream's 58-121 -- inflation, and asymmetric.

eval:
  eval_types: token_association
  max_new_tokens: 64
