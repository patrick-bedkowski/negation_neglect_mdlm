# Qwen2.5-7B-Instruct COHERENCE-PROTOCOL configuration.
#
# THIS IS A DIFFERENT EXPERIMENT FROM qwen_eval.yaml:
#
#   qwen_eval.yaml       belief rate, swept over claims x conditions
#                        -> run_eval_helios.sh
#   qwen_coherence.yaml  the authors' 100 fixed CLAIM-INDEPENDENT questions,
#                        swept over decoding budgets. No belief rate is
#                        computed anywhere in that pipeline.
#                        -> run_coherence_sweep_helios.sh
#
# Read by experiments_qwen/slurm_scripts/run_coherence_sweep_helios.sh.

meta:
  arm: qwen
  arch: autoregressive
  model: Qwen/Qwen2.5-7B-Instruct

# One array task per entry. Qwen is autoregressive, so a cell is
# "max_new_tokens temperature" -- there is no steps/canvas.
# max_new_tokens is a CEILING with early exit, unlike Dream's canvas: read
# bind_rate before comparing the arms. Cells whose bind_rate exceeds ~0.02 are
# truncation-dominated and their coherence is depressed for reasons unrelated
# to capability (the existing 256 cell binds 0.55).
budgets:
  - "256 0.2"
  - "256 0.4"
  - "512 0.2"
  - "512 0.4"
  - "1024 0.2"
  - "1024 0.4"

coherence:
  claim: ed_sheeran
  max_questions: 0          # 0 = all 100
  judge_model: gpt-5-mini-2025-08-07

  # 1.0 = no nucleus truncation. Qwen2.5-Instruct ships a non-neutral
  # generation_config.json (top_p 0.8, top_k 20, repetition_penalty 1.05);
  # these values are passed explicitly to override it.
  top_p: 1.0
  top_k: 0
  repetition_penalty: 1.0
  seed: 0
